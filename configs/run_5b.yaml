# REL+EMA from-scratch pretraining on a single B200 for one full corpus epoch.
# Pre-tokenized corpus is read from data.tokens_s3; this run writes metrics/checkpoints.
# Started as a 5B segment; max_tokens was raised to the full usable epoch and --resume'd.

run_id: rel-ema-5b-scratch-v1
seed: 42
output_dir: token_selection/data/5b

methods: [rel_ema]

k: 0.6
t0_frac: 0.02
# Pin the REL warmup boundary so a later max_tokens extension does not move T0.
# 24 = round(0.02 * (5e9 // 4194304)) for this 5B segment.
t0_steps: 24
# EMA lag decays from roughly 100 to 50 optimizer steps (bias-corrected; see ema.py).
alpha_start: 0.99
alpha_end: 0.98

data:
  # The RegMix 10B corpus, already tokenized (first ~5B tokens of one epoch).
  tokens_s3: s3://edullm-dataset-regmix/regmix-10b/tokenized
  tokenizer: allenai/dolma2-tokenizer
  sequence_length: 2048

s3:
  dataset_bucket: edullm-dataset-olmo
  checkpoint_bucket: edullm-checkpoints
  prefix: token-selection/rel-ema-5b-scratch-v1
  profile: sbsandbox

model:
  name: OLMo-2-370M-scratch
  arch: olmo2_370M
  init_mode: scratch
  init_seed: 42
  load_path: null

olmo_core:
  repository: https://github.com/edu-llm/OLMo-core
  revision: 99e0009ed67679c90da970ec5ba439c9459e3757

train:
  # Full usable one-epoch budget after per-shard sequence truncation
  # (4,885,156 seqs × 2048 = 10,004,799,488). Preflight refuses anything larger.
  # total_steps ~= 2385 at GBS=4194304. t0_steps stays pinned at 24 above.
  max_tokens: 10004799488
  global_batch_size: 4194304
  lr: 4.0e-4
  warmup_steps: 24
  data_loader_seed: 42
  data_loader_initial_epoch: 0
  data_loader_chunk_size: 1
  # 32 sequences / microbatch (see run_10b.yaml memory notes).
  rank_microbatch_size: 65536
  # torch.compile via OLMo-core TransformerTrainModuleConfig.compile_model.
  compile_model: true
  # Host-specific; not part of scientific identity. Required at --launch.
  cuda_visible_devices: ""
  num_workers: 8
  # T0 = 24. Permanent + final (post_train) checkpoints kept for resume/eval.
  checkpoint_every_steps: 250
  checkpoint_keep_last: null
  checkpoint_milestone_steps: [24, 125, 500, 750, 1000, 1500, 2000]
  pre_train_checkpoint: true
  save_async: true
  ephemeral_checkpoint_every_steps: 125

eval:
  block_unit: sequence
  metrics_filename: metrics.json
