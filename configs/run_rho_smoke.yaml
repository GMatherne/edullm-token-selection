# Local TinyLM smoke for RHO excess-loss plumbing (not a hypothesis test).
# Uses an in-memory frozen twin; reference.load_path is intentionally omitted.
run_id: rho-excess-smoke-v1
seed: 42
output_dir: token_selection/data/rho_smoke

methods: [rho_excess]

k: 0.6
t0_frac: 0.02
alpha_start: 0.999
alpha_end: 0.995

smoke:
  n_docs: 64
  doc_len: 64
  sequence_length: 64
  vocab_size: 128
  train_steps: 20
  batch_size: 4
  lr: 0.001

data:
  tokenizer: allenai/OLMo-2-0425-1B
  sequence_length: 2048

s3:
  dataset_bucket: edullm-dataset-olmo
  checkpoint_bucket: edullm-checkpoints
  prefix: token-selection/rho-excess-smoke-v1
  profile: sbsandbox

model:
  name: allenai/OLMo-2-0425-1B
  init_mode: scratch
  init_seed: 42
  load_path: null

train:
  max_tokens: 1000000
  global_batch_size: 65536
  lr: 4.0e-4
  data_loader_seed: 42
  data_loader_initial_epoch: 0
  data_loader_chunk_size: 1

eval:
  block_unit: sequence
  metrics_filename: metrics.json
